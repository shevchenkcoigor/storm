name: Bench Ratio Spike (throwaway — #551)

# THROWAWAY — see issue #551 ("Do this first" section).
#
# The verdict comes from benchmarks/scripts/ratio_gate.py's exit code (#752), but a
# below-threshold result is only a warning until the threshold decision lands.
# Runs storm_bench + storm_anchors in the same job and prints the
# per-benchmark storm/raw ratio for the anchored subset, so it can be
# triggered 8-10x on unchanged code to measure how stable that ratio actually
# is on a shared ubuntu-24.04 runner before anyone designs a threshold on top
# of it. #241's ±5% gate on absolute walltime died to exactly that mistake —
# see #551 for the post-mortem.
#
# Two-stage shape: `build` compiles once and uploads storm_bench + storm_anchors
# as an artifact; `run-category` fans out over WHERE/SELECT/INSERT in parallel,
# each downloading that same artifact instead of rebuilding. Compilation (this
# is C++26 reflection — minutes) dominates over actually running this small
# anchored subset (seconds to low minutes even for the INSERT sweep), so
# splitting the categories into parallel jobs only pays off if the build is
# shared rather than repeated per category.
#
# raw+storm still run sequentially within EACH category job, never split
# across jobs — that pairing is the entire point of the in-place-ratio design
# (same job, same runner, correlated noise cancels in the ratio). Only the
# category split is parallel. Within a job, raw+storm run in 3 INTERLEAVED
# rounds (round 1: raw then storm, round 2: raw then storm, ...), not "all
# raw reps then all storm reps" — see .claude/commands/benchmark.md's Trap 2.
#
# Manual dispatch only: this is meant to be fired repeatedly by hand while
# collecting samples, not to run on every push/PR. Delete this file (or
# convert it into the real gate) once the measurement is done.

on:
  workflow_dispatch: {}

jobs:
  build:
    name: build storm_bench + storm_anchors
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      # Keep in sync with ci.yml's `test` job pin — same image, same toolchain,
      # so this measures the runner, not a toolchain difference.
      image: ghcr.io/spiritecosse/storm-ci@sha256:ae4f62771d7611c663ccb8e0061af9acc8a8a3fe604eabde4285d11a77d37a61
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link clang-p2996 next to source dir
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Create libc++ modules symlink for import std;
        # Same rationale as ci.yml's test job (issue #326).
        run: |
          clang_root="$(dirname "$GITHUB_WORKSPACE")/clang-p2996"
          share_dir="$clang_root/build/share/libc++"
          link="$share_dir/v1"
          target="$clang_root/build/modules/c++/v1"
          if [ -d "$target" ] && [ ! -e "$link" ]; then
            mkdir -p "$share_dir"
            ln -sfn "$target" "$link"
          fi

      - name: Cache CPM packages
        uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-ninja-release-${{ hashFiles('cmake/cpm.cmake', 'cmake/cmake-scripts.cmake', 'cmake/uuid.cmake', 'cmake/tests.cmake', 'cmake/bench.cmake') }}
          restore-keys: |
            cpm-ninja-release-
            cpm-

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          # No run_attempt in this name (unlike the per-category upload below,
          # which needs it): "Re-run failed jobs" bumps run_attempt for the
          # whole workflow WITHOUT re-running this already-succeeded job, so a
          # name that embeds run_attempt would ask run-category to download an
          # artifact this job never uploaded on that attempt. overwrite: true
          # makes "Re-run ALL jobs" (which DOES re-run this job) work too.
          name: bench-binaries-${{ github.run_id }}
          path: |
            build/release/benchmarks/storm_bench
            build/release/benchmarks/storm_anchors
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  run-category:
    name: "ratio: ${{ matrix.category }}"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/spiritecosse/storm-ci@sha256:ae4f62771d7611c663ccb8e0061af9acc8a8a3fe604eabde4285d11a77d37a61
    strategy:
      fail-fast: false
      matrix:
        # Filters are the exact benchmark names benchmarks/README.md documents
        # as having a raw counterpart. Source of truth is
        # benchmarks/anchors_raw.cpp's ->Name(...) registrations +
        # kBatchStandard — #552 (widening the anchor set to
        # UPDATE/DELETE/AGGREGATE) will make this list stale; re-check against
        # anchors_raw.cpp when picking this back up, and add matrix entries
        # for the new categories rather than folding them into an existing one.
        include:
          - category: where
            filter: 'Storm/WHERE/where_int_comparison_gt/N:10000$|Storm/WHERE/where_bool_equality/N:10000$'
          - category: select
            filter: 'Storm/SELECT/select/N:10000$'
          - category: insert
            filter: 'Storm/INSERT/insert/N:(1|10|100|500|1000|5000|10000|50000|100000)$|Storm/INSERT/insert_no_return/N:(1|10|100|500|1000|5000|10000|50000|100000)$'
    # Must keep `container:` — cmake/libcxx.cmake bakes an absolute,
    # unnormalized rpath ($GITHUB_WORKSPACE/../clang-p2996/build/lib/...) into
    # both binaries at link time. That only resolves here because containerized
    # jobs get GITHUB_WORKSPACE=/__w/storm/storm, matching the build job's —
    # a bare `runs-on` without `container:` would use /home/runner/work/... and
    # the binaries would fail to start. LD_LIBRARY_PATH below is belt-and-
    # braces against exactly that class of drift (DT_RUNPATH prefers it over
    # the baked rpath), not a substitute for keeping this container.
    env:
      LD_LIBRARY_PATH: /opt/clang-p2996/build/lib/x86_64-unknown-linux-gnu
    steps:
      # No checkout, no configure/build — this job only executes the binaries
      # the build job already produced. $GITHUB_WORKSPACE still exists as the
      # job's working directory without a checkout, which is all the symlink
      # below needs.
      - name: Link clang-p2996 next to source dir
        # Runtime dependency, not a build one: the binaries dynamically link
        # libc++/libc++abi/libunwind via an rpath resolved relative to this
        # same sibling path at link time (see the build job's identical
        # step) — without it here, the binaries fail to start in this job's
        # own fresh container/workspace. LD_LIBRARY_PATH (job env, above) is
        # the belt to this symlink's braces.
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Fetch ratio_gate.py
        # Sparse: this job deliberately has no full checkout (it only runs the
        # binaries the build job produced); the gate script is the one source file
        # it needs. Done before the download so checkout cannot clobber the binaries.
        uses: actions/checkout@v4
        with:
          sparse-checkout: benchmarks/scripts/ratio_gate.py
          sparse-checkout-cone-mode: false

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: bench-binaries-${{ github.run_id }}

      - name: Make binaries executable
        # actions/upload-artifact@v4 does NOT preserve the exec bit
        # (documented limitation) — this chmod is required, not optional.
        run: chmod +x storm_bench storm_anchors

      # Interleaved rounds, not "all anchors then all storm" — this is Trap 2
      # from .claude/commands/benchmark.md verbatim: running one side's reps
      # entirely before the other's hands thermal/scheduler drift to whichever
      # binary runs second, and only interleaving cancels that common-mode
      # drift. 3 rounds (the doc's own example uses 5; 3 is the cheaper choice
      # for a spike, bump it if the first samples look ambiguous) each running
      # BOTH binaries — the round-level ratio computed per round in the next
      # step is the direct answer to #551's decision question ("how stable is
      # the ratio"), separate from and complementary to the 8-10 cross-dispatch
      # samples the issue also asks for.
      - name: Run raw anchors + storm_bench, interleaved (${{ matrix.category }})
        run: |
          for round in 1 2 3; do
            ./storm_anchors \
              --benchmark_filter="${{ matrix.filter }}" \
              --benchmark_repetitions=6 \
              --benchmark_report_aggregates_only=true \
              --benchmark_format=json \
              --benchmark_out="raw_${round}.json"

            ./storm_bench \
              --benchmark_filter="${{ matrix.filter }}" \
              --benchmark_repetitions=6 \
              --benchmark_report_aggregates_only=true \
              --benchmark_format=json \
              --benchmark_out="storm_${round}.json"
          done

      - name: Compute storm/raw ratio and apply the gate
        # The verdict is ratio_gate.py's exit status (0 pass / 1 below threshold /
        # 2 unusable data) — the same script a local run uses, tested by
        # scripts/ci/tests/test_ratio_gate.py. INSERT's 80% override is temporary:
        # the bulk path sits at ~85% of raw (#779); raise it when that is closed.
        #
        # Exit 1 (below threshold) is only a warning for now: the 8-run spike data in
        # #752 has WHERE/SELECT at a minimum of 95.6% and INSERT at 80.5%, so a
        # single-run threshold would flake on noise. The threshold DoD item (and its
        # K-consecutive-runs rule) decides when this becomes fatal. Exit 2 (unusable
        # data) stays fatal: that is a broken measurement, not a slow one.
        run: |
          set +e
          python3 benchmarks/scripts/ratio_gate.py \
            --raw raw_1.json raw_2.json raw_3.json \
            --storm storm_1.json storm_2.json storm_3.json \
            --threshold 95 \
            --override Storm/INSERT/=80 \
            --title "storm/raw ratio — run ${GITHUB_RUN_NUMBER} / ${MATRIX_CATEGORY}" \
            --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "::warning::${MATRIX_CATEGORY}: a benchmark is below its ratio threshold (informational until #752's threshold decision)"
            exit 0
          fi
          exit "$status"
        env:
          MATRIX_CATEGORY: ${{ matrix.category }}

      - name: Upload raw JSON (for cross-run cv analysis)
        # always(): raw_*.json/storm_*.json are already written by the
        # previous step by the time the ratio gate step could fail (e.g.
        # ratio_gate.py's exit 2 on a partial match) — keep them on a failed run too, since
        # they're exactly the evidence needed to see which benchmark drifted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ratio-spike-${{ matrix.category }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            raw_*.json
            storm_*.json
          retention-days: 30
