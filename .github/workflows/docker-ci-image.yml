name: Build storm-ci image

on:
  workflow_dispatch:
    inputs:
      clang_rev:
        description: |
          Tag to publish in addition to :latest (e.g. clang-rev-12345).
          Leave empty to publish only :latest.
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'clang-rev-*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish storm-ci
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        env:
          INPUT_CLANG_REV: ${{ inputs.clang_rev }}
        run: |
          tags=("ghcr.io/spiritecosse/storm-ci:latest")
          # Tag-triggered runs: use the git tag as the rev tag.
          if [[ "${GITHUB_REF}" == refs/tags/clang-rev-* ]]; then
              tags+=("ghcr.io/spiritecosse/storm-ci:${GITHUB_REF_NAME}")
          fi
          # workflow_dispatch with non-empty input: validate (alphanumerics,
          # dot, dash, underscore only) and add as an additional tag.
          if [[ -n "${INPUT_CLANG_REV}" ]]; then
              if [[ ! "${INPUT_CLANG_REV}" =~ ^[A-Za-z0-9._-]+$ ]]; then
                  echo "Invalid clang_rev: must match [A-Za-z0-9._-]+" >&2
                  exit 1
              fi
              tags+=("ghcr.io/spiritecosse/storm-ci:${INPUT_CLANG_REV}")
          fi
          # Emit comma-joined list for docker/build-push-action.
          (IFS=,; echo "tags=${tags[*]}") >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Publishing is only half the job: the digest then has to be pinned in
      # ci.yml, clang-tidy-sweep.yml and bench-ratio-spike.yml, and until #643
      # this run surfaced it nowhere — you had to pull the image or dig through
      # the GHCR package page to find out what you had just published. Print it
      # into the job summary so the whole publish flow is doable from a browser.
      # scripts/check_ci_digests.py asserts those three pins AGREE with each other; it cannot
      # tell you they are stale, so nothing catches a skipped update.
      - name: Report digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## storm-ci published"
            echo
            echo '```'
            echo "ghcr.io/spiritecosse/storm-ci@${DIGEST}"
            echo '```'
            echo
            echo "Pin this in **all three** workflows, then let \`scripts/check_ci_digests.py\` confirm they agree:"
            echo
            echo "- \`.github/workflows/ci.yml\` (3 occurrences)"
            echo "- \`.github/workflows/clang-tidy-sweep.yml\` (1)"
            echo "- \`.github/workflows/bench-ratio-spike.yml\` (2)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${DIGEST}"
