name: CI

# Do NOT add `paths:` / `paths-ignore:` here. `CI gate` (bottom of this file) is
# a required status context, and a run filtered out entirely never reports it —
# leaving the PR unmergeable, which is strictly worse than the container pulls
# such a filter would be trying to save. Cheapness for docs-only PRs is the
# `changes` job's business, below.
#
# The heavy jobs (`test`, `coverage`, `clang-p2996-host-layout`) do NOT run on
# `push` to develop (#700). develop merges through a merge queue (#711): each
# PR lands only after a `merge_group` run on develop + the queued PRs — the
# exact tree the merge produces — passed `CI gate`; rebuilding that tree after
# the merge proves nothing new. (Before the queue, `strict` branch protection
# gave the same guarantee via the PR's `refs/pull/N/merge` run, at the price of
# an "Update branch" + full re-run whenever develop moved.) The nightly
# `schedule` run is the net for what that gate does not cover: a leg merged red
# while a protection rule was relaxed. Keep the queue (or `strict`) on: without
# either, the post-merge run is the only check on two PRs combined, and the
# heavy jobs must come back on `push`.
# Nothing alerts on a red nightly beyond GitHub's email to whoever last edited
# the cron line — check `gh run list --workflow ci.yml --event schedule`.
# A develop commit shows one skipped check literally named
# `${{ matrix.preset }} / PG ${{ matrix.postgres }}`: that is the job-level
# matrix skip, harmless on a push (see the heavy jobs' `if:`), not #638.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # The merge queue's run on develop + the queued PRs (#711). Without this
  # trigger nothing reports on a merge-group commit and every queued PR waits
  # out the queue's status-check timeout.
  merge_group:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# One group per PR, so a new push cancels that PR's now-outdated run (#700).
# Every other event gets a group of its own (run_id), so a develop push, a
# nightly run or a merge-queue (`merge_group`) run is never cancelled — or left pending and replaced, which a shared
# group does to queued runs even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Classifies the diff (PR: against the exact base commit recorded on the PR
  # event; merge_group: against the queue's base, develop's tip the group was
  # built on (#711); push: against the pre-push SHA, computed but unread since #700 skips
  # the heavy jobs on push; schedule/workflow_dispatch carry no `before`, so
  # they run everything) via scripts/detect-changes.sh —
  # the same script commit.sh uses for its staged-file smart skips, so both
  # places agree on what counts as "src/tests/cmake changed". `run_heavy`
  # gates the expensive STEPS of the `test` / `coverage` /
  # `clang-p2996-host-layout` jobs below: a PR touching only docs/ or
  # unrelated top-level files reports those jobs green without configuring,
  # building or testing anything.
  #
  # The gate is on the steps, not on the jobs, and that distinction is
  # load-bearing (#638). A job skipped by a job-level `if:` still produces a
  # check run — but a MATRIX job produces exactly ONE, named with the matrix
  # expression unexpanded (`${{ matrix.preset }} / PG ${{ matrix.postgres }}`).
  # The per-matrix contexts develop's branch protection requires
  # (`ninja-debug / PG 17`, `ninja-tsan / PG 17`, ...) are then never reported
  # at all, and the PR sits at "Expected — waiting for status to be reported"
  # with no way to merge it. #607 introduced the skip on the assumption that a
  # skipped required check reads as passed; that holds for a plain job, not for
  # the matrix. Gating the steps keeps every context name intact and green.
  #
  # The price, stated honestly because the next person will see it: `container:`
  # and `services:` are resolved BEFORE the first step's `if:` is evaluated and
  # cannot be gated, so a docs-only PR still pulls the (multi-GB) storm-ci image
  # nine times and starts eight postgres services. That is minutes, not seconds
  # — but no configure/build/test, against 12-22 min of matrix before. It also
  # gives docs-only PRs an infrastructure failure surface they did not have when
  # the jobs were skipped outright: a GHCR outage, an unavailable pinned digest,
  # or a pg_isready health-check flake now reds a required context on a PR that
  # changed nothing but prose. Accepted as the cost of a mergeable PR.
  #
  # That cost is removable: the `ci-gate` job at the bottom of this file is a
  # single always-running required context, and once develop's branch
  # protection requires IT instead of the individual job names, these three
  # jobs can go back to skipping outright — zero containers, zero services.
  # See that job's comment for the exact edit; it is three lines, and it must
  # not be made before the required-checks list is changed.
  #
  # Fail-closed by design: this job's output defaults every consumer's `if:`
  # to "run" unless it explicitly says `run_heavy == 'false'` (see those
  # jobs below) — so a failed/erroring changes job, or a detect-changes.sh
  # that produced no output, runs the full suite instead of silently
  # skipping it. Also always runs heavy jobs when anything CI itself
  # consumes changes (workflows, scripts/, .githooks/, CMakePresets.json,
  # commit.sh) — see the grep below — so an edit to that plumbing gets
  # verified by the very jobs it configures instead of skipping itself.
  changes:
    name: detect changed files
    runs-on: ubuntu-24.04
    outputs:
      run_heavy: ${{ steps.detect.outputs.run_heavy }}
      run_cold_cpm: ${{ steps.detect.outputs.run_cold_cpm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test detect-changes.sh
        run: ./scripts/tests/test_detect_changes.sh

      - name: Detect changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The exact base commit GitHub recorded when the PR event fired —
            # not a live lookup of origin/develop's current tip, which could
            # have moved since (and would then diff in develop's own newer
            # commits alongside the PR's).
            files=$(git diff --name-only "$BASE_SHA" HEAD)
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            # HEAD is the group's merge commit; base_sha is the develop commit
            # the group was built on, so this is every queued PR's change and
            # nothing of develop's own.
            files=$(git diff --name-only "$QUEUE_BASE_SHA" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            # New/recreated branch, or no usable prior SHA — nothing to
            # safely diff against. Default to the safe choice: run
            # everything, rather than guessing at a diff base.
            echo "No prior SHA to diff against — defaulting to run_heavy=true"
            echo "run_heavy=true" | tee -a "$GITHUB_OUTPUT"
            echo "run_cold_cpm=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$files"

          detected=$(printf '%s\n' "$files" | ./scripts/detect-changes.sh)
          eval "$detected"
          : "${HAS_SRC_CHANGES:?detect-changes.sh produced no output}"

          run_heavy=false
          if [[ "$HAS_SRC_CHANGES" == true || "$HAS_TEST_CHANGES" == true \
             || "$HAS_CPP_CHANGES" == true || "$HAS_CMAKE_CHANGES" == true \
             || "$HAS_BENCH_CHANGES" == true ]]; then
            run_heavy=true
          fi

          # Anything CI itself reads or runs forces a full run, regardless of
          # the src/tests/cmake classification above. docker/ is in the list
          # because the jobs below run INSIDE that image (#643); nothing builds
          # it on a PR, so a docker-only change would otherwise get no CI at all
          # until the next manual publish.
          plumbing_changed=false
          if grep -qE '^(\.github/workflows/|scripts/|\.githooks/|docker/|CMakePresets\.json$|commit\.sh$)' <<< "$files"; then
            plumbing_changed=true
            run_heavy=true
          fi

          # The cold-CPM configure (#702) only needs the diffs that can change
          # what CPM fetches — any CMakeLists.txt / *.cmake (the pins) — plus
          # the same CI plumbing, so an edit to that job verifies itself. The
          # nightly `schedule` run takes the no-prior-SHA branch above and always
          # runs it: that is what catches an upstream ref deleted while nothing
          # here changed (#697).
          run_cold_cpm=false
          if [[ "$HAS_CMAKE_CHANGES" == true || "$plumbing_changed" == true ]]; then
            run_cold_cpm=true
          fi

          echo "run_heavy=$run_heavy" | tee -a "$GITHUB_OUTPUT"
          echo "run_cold_cpm=$run_cold_cpm" | tee -a "$GITHUB_OUTPUT"

  # Every pre-commit guard, run over the whole tree (#708). The cheap shell/Python
  # checks — agent frontmatter (#543), ORM backend neutrality, the clang-tidy
  # skip-list (#550), SessionStart hook wiring (#651), the per-OS PG socket
  # default, the line-coverage parser (#680), the commit.sh helpers (#688), the
  # storm-ci digest pins (#530) and the rest — are rows of ONE table,
  # scripts/pre_commit_guards.py's GUARDS, which commit.sh also runs. This job
  # used to be seven hand-written jobs that had drifted from that table: some
  # guards ran only pre-commit, four self-tests ran nowhere. `--all` runs every
  # row regardless of what changed, because the hook is bypassable (an unwired
  # clone, a web edit, a merge) and only runs the guards a commit's files
  # trigger. A new guard is covered here by adding its row, with no edit to this
  # file; scripts/tests/test_pre_commit_guards.py fails if a self-test is in
  # neither the table nor its NOT_GUARDED list. Pure bash/python/perl plus cmake >=
  # 3.16 and ninja for test_cmake_format_target.sh (scripts/README.md lists each
  # self-test's prerequisites); no compiler, so it runs on every PR.
  script-guards:
    name: pre-commit guards (all, #708)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The hosted image ships cmake; ninja is installed only if it is absent, so
      # an image change cannot turn a guard red for a reason unrelated to it.
      - name: Ensure ninja
        run: command -v ninja || { sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build; }

      - name: Run every guard in scripts/pre_commit_guards.py
        run: ./scripts/pre_commit_guards.py --all

  # The SonarCloud quality gate as a job of this workflow (#711), so `CI gate`
  # can require it. The SonarCloud app posts `SonarCloud Code Analysis` on PRs
  # only, never on the merge queue's merge-group commits; required directly, it
  # would leave every queued PR waiting out the timeout. scripts/sonar_gate.py
  # polls that check run on the PR head and fails unless it concluded
  # `success`; on any other event (merge_group, push, schedule) it passes at
  # once — a queued PR was already gated on its own PR run. GITHUB_TOKEN with
  # `checks: read` is all it needs; no Sonar token. The script's own 30-min
  # poll timeout fails before this job's 40-min one would.
  sonar-gate:
    name: SonarCloud gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      checks: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for the SonarCloud check on the PR head
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/sonar_gate.py

  # cmake/clang_p2996_host.cmake resolves clang-p2996's on-disk layout
  # (Linux/amd64 Docker vs. native macOS/arm64) for CMAKE_CXX_STDLIB_MODULES_JSON
  # and cmake/libcxx.cmake's compile/link flags. Nothing else in CI exercises
  # its Darwin branch or its unsupported-host error path (this CI only ever
  # runs the Linux/amd64 branch for real) — this job runs the fake-root test
  # harness so both are covered, not just the one this container's host
  # happens to be. Needs CMake 3.30+ (cmake_minimum_required in the harness),
  # hence the storm-ci container rather than bare ubuntu-24.04's older apt cmake.
  clang-p2996-host-layout:
    name: clang-p2996 host-layout resolution
    needs: changes
    # Always RUNS on a PR (fail-closed on a broken `changes` job, whose empty
    # output reads as "not false"); the steps below are what `run_heavy` gates.
    # See the note on the `changes` job for why that is not a job-level `if:`.
    # The `push` skip IS job-level: no branch protection reads the contexts of
    # a develop push run, so #638 cannot bite there (see the note under `on:`).
    if: ${{ !cancelled() && github.event_name != 'push' }}
    env:
      RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
    runs-on: ubuntu-24.04
    container:
      # Pinned to a specific digest so develop is unaffected by storm-ci image
      # rebuilds. Bump this when publishing a new image (see docker-ci-image.yml).
      image: ghcr.io/spiritecosse/storm-ci@sha256:ae4f62771d7611c663ccb8e0061af9acc8a8a3fe604eabde4285d11a77d37a61
    steps:
      - name: No src/tests/cmake changes — heavy steps skipped
        if: env.RUN_HEAVY == 'false'
        run: echo "Diff touches none of src/, tests/ or cmake — build/test steps skipped."

      - name: Checkout
        if: env.RUN_HEAVY != 'false'
        uses: actions/checkout@v4

      - name: Test host-layout resolution + import-std symlink behavior
        if: env.RUN_HEAVY != 'false'
        run: ./scripts/tests/test_libcxx_modules_symlink.sh

  test:
    name: "${{ matrix.preset }} / PG ${{ matrix.postgres }}"
    # ninja-msan is skipped in CI: under import std; (issue #326) GTest's static
    # TEST() macro registration move-constructs std::string through the
    # MSAN-instrumented std module, and MSAN reports the SSO buffer as
    # uninitialized — aborting the binary before any test body runs. This is a
    # false positive in clang-p2996's MSAN + import std; combination, so the
    # preset produces no signal. Re-add the matrix entry once a fixed
    # clang-p2996 build lands (track at #326).
    needs: changes
    # Always RUNS on a PR (fail-closed on a broken `changes` job, whose empty
    # output reads as "not false"); the steps below are what `run_heavy` gates.
    # See the note on the `changes` job for why that is not a job-level `if:`.
    # The `push` skip IS job-level: no branch protection reads the contexts of
    # a develop push run, so #638 cannot bite there (see the note under `on:`).
    if: ${{ !cancelled() && github.event_name != 'push' }}
    env:
      RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
    runs-on: ubuntu-24.04
    container:
      # Pinned to a specific digest so develop is unaffected by storm-ci image
      # rebuilds. Bump this when publishing a new image (see docker-ci-image.yml).
      image: ghcr.io/spiritecosse/storm-ci@sha256:ae4f62771d7611c663ccb8e0061af9acc8a8a3fe604eabde4285d11a77d37a61

    services:
      postgres:
        image: "postgres:${{ matrix.postgres }}"
        env:
          POSTGRES_DB: storm_db
          POSTGRES_USER: storm_db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U storm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          # Core presets — latest PG
          - preset: ninja-debug
            build_dir: debug
            postgres: 17
          - preset: ninja-asan-ubsan
            build_dir: asan-ubsan
            postgres: 17
          - preset: ninja-tsan
            build_dir: tsan
            postgres: 17

          # PG compat — same build, different PG service
          - preset: ninja-debug
            build_dir: debug
            postgres: 14
          - preset: ninja-debug
            build_dir: debug
            postgres: 15
          - preset: ninja-debug
            build_dir: debug
            postgres: 16

          # Release build — the only preset with ENABLE_BENCH=ON, so this is
          # the sole job that compiles benchmarks/ (storm_bench, storm_anchors)
          # and any Release-mode code. Closes the blind spot that let #464 ship
          # green while storm_bench was broken locally. Re-enabled by #466: the
          # old clang-scan-deps SIGSEGV under -O3 -std=c++26 -fmodules is gone
          # with the clang-p2996 build shipped in the pinned storm-ci image.
          - preset: ninja-release
            build_dir: release
            postgres: 17

    steps:
      - name: No src/tests/cmake changes — heavy steps skipped
        if: env.RUN_HEAVY == 'false'
        run: echo "Diff touches none of src/, tests/ or cmake — build/test steps skipped."

      - name: Checkout
        if: env.RUN_HEAVY != 'false'
        uses: actions/checkout@v4

      - name: Link clang-p2996 next to source dir
        if: env.RUN_HEAVY != 'false'
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Create libc++ modules symlink for import std;
        if: env.RUN_HEAVY != 'false'
        # import std; (issue #326): CMake's CXX_MODULE_STD support looks for
        # std.cppm / std.compat.cppm at build/share/libc++/v1/ (declared in
        # libc++.modules.json) but clang-p2996 places them under
        # build/modules/c++/v1/. cmake/libcxx.cmake creates this symlink at
        # configure time when LIBCXX_ROOT is writable, but the clang-p2996
        # dir is read-only in CI — create it here before cmake --preset runs.
        # IMPORTANT: use the same path the previous step symlinked
        # ($(dirname GITHUB_WORKSPACE)/clang-p2996), not /opt/clang-p2996,
        # because that is what LIBCXX_ROOT resolves to during configure.
        run: |
          clang_root="$(dirname "$GITHUB_WORKSPACE")/clang-p2996"
          share_dir="$clang_root/build/share/libc++"
          link="$share_dir/v1"
          target="$clang_root/build/modules/c++/v1"
          echo "clang_root=$clang_root"
          echo "target=$target  exists=$([ -d "$target" ] && echo yes || echo no)"
          echo "link=$link  exists=$([ -e "$link" ] && echo yes || echo no)"
          if [ -d "$target" ] && [ ! -e "$link" ]; then
            mkdir -p "$share_dir"
            ln -sfn "$target" "$link"
            echo "Created symlink: $link -> $target"
          else
            echo "Symlink already exists or target missing — skipping"
            ls -la "$link" 2>/dev/null || true
          fi

      - name: Cache CPM packages
        if: env.RUN_HEAVY != 'false'
        uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ matrix.preset }}-${{ hashFiles('cmake/cpm.cmake', 'cmake/cmake-scripts.cmake', 'cmake/uuid.cmake', 'cmake/tests.cmake', 'cmake/bench.cmake') }}
          restore-keys: |
            cpm-${{ matrix.preset }}-
            cpm-

      - name: Configure
        if: env.RUN_HEAVY != 'false'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        if: env.RUN_HEAVY != 'false'
        run: ./scripts/build-with-retry.sh ${{ matrix.preset }}

      - name: Test
        if: env.RUN_HEAVY != 'false'
        env:
          STORM_PG_CONNSTR: "host=postgres port=5432 dbname=storm_db user=storm_db"
        run: ctest --test-dir build/${{ matrix.build_dir }} --output-on-failure --no-tests=error

      - name: Atlas integration test
        if: >-
          env.RUN_HEAVY != 'false'
          && matrix.preset == 'ninja-debug' && matrix.postgres == 17
        run: |
          curl -sSf https://atlasgo.sh | sh
          ./scripts/test-atlas-migration.sh

      # Full-tree clang-tidy sweep — tracked by issue #262.
      # Enable once the pre-existing drift across src/ and tests/ is cleaned up.
      # The clang-p2996 rebuild on 2026-05-11 first surfaced 48 warnings in
      # src/orm/statements/*.cppm + src/db/postgresql.cppm, which are addressed
      # in this PR — but other source files almost certainly carry similar
      # accumulated violations that were masked by the same `.cppm` parse-failure
      # auto-skip in scripts/run_clang_tidy.py. Enabling --all in CI now would
      # fail every PR. Uncomment after issue #262's cleanup pass lands.
      # - name: clang-tidy full sweep
      #   if: matrix.preset == 'ninja-release' && matrix.postgres == 17
      #   run: ./scripts/run_clang_tidy.py --all

  # Reproduces commit.sh step 5 (the 100%-line-coverage gate) in CI, so the gate
  # stops being self-reported from one developer's machine. Deliberately NOT a
  # matrix entry on `test`: it needs no postgres service, runs a different build
  # target, and would otherwise be duplicated across the whole PG matrix for no
  # extra signal.
  #
  # What the 100% actually means: 100% of the FILTERED set — 24 files / 8613
  # lines, after `LCOV_EXCL` markers are removed from the denominator (56 markers
  # across 11 files in src/). It is NOT 100% of every line in the tree. Function
  # coverage is ~81% and branch ~92%, which is why the parse below anchors on the
  # `lines.......` row specifically.
  #
  # Preset is `ninja-debug-coverage`, and this job attaches a postgres service.
  # #528 originally proposed running coverage WITHOUT one, on the premise that
  # the local 100% did not depend on a live server. That premise was wrong: the
  # local number was measured on a machine running PG at /var/run/postgresql,
  # which is exactly the socket coverage-run-batched.sh defaults to on Linux (macOS
  # defaults to /tmp, see scripts/pg-default-connstr.sh), so PG tests
  # were quietly running and their lines were quietly counted. With PG genuinely
  # absent the same tree measures ~99.8-99.9% (functions drop 80.6% -> 48.7%),
  # because the PG Connection's constexpr transaction-nesting methods and part of
  # pool.cppm are instantiated only by a live connection.
  #
  # So the choice was never "dependency vs no dependency" — the dependency was
  # already there, just implicit and undeclared. Attaching the service makes it
  # explicit and makes local and CI measure the same thing, which is the
  # comparability the issue was built on. It also means a contributor without a
  # local PG can no longer be blocked by a gate they cannot reproduce.
  #
  # Runs per-PR (and in the #700 nightly), not nightly-only. Measured cold (rm -rf build, empty ccache,
  # CPM sources cached as CI caches them): configure 1s + build 73s + coverage
  # 19s = 93s on 32 cores. The build phase is the parallel part and dominates, so
  # on a 4-core runner expect roughly 6-9 min wall clock — comparable to the
  # existing matrix jobs and well short of needing a nightly schedule. Revisit if
  # it starts gating PR turnaround.
  coverage:
    name: coverage (100% lines, filtered)
    needs: changes
    # Always RUNS on a PR (fail-closed on a broken `changes` job, whose empty
    # output reads as "not false"); the steps below are what `run_heavy` gates.
    # See the note on the `changes` job for why that is not a job-level `if:`.
    # The `push` skip IS job-level: no branch protection reads the contexts of
    # a develop push run, so #638 cannot bite there (see the note under `on:`).
    if: ${{ !cancelled() && github.event_name != 'push' }}
    env:
      RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
    runs-on: ubuntu-24.04
    container:
      # Keep in sync with the `test` job's pin — scripts/check_ci_digests.py asserts they agree.
      # lcov/genhtml ship in the image already (docker/ci/Dockerfile), so this
      # job needs no image change.
      image: ghcr.io/spiritecosse/storm-ci@sha256:ae4f62771d7611c663ccb8e0061af9acc8a8a3fe604eabde4285d11a77d37a61

    # A real PostgreSQL is REQUIRED for the 100% gate, not an optimization. The
    # PG Connection's constexpr transaction-nesting methods
    # (postgresql_connection.cppm:171-181) and part of pool.cppm are instantiated
    # only by a live connection — tests/mock_libpq does not reach them — so
    # without a server this job measures ~99.8-99.9% and fails. PG 17 matches the
    # `test` job's primary entry; the coverage number does not vary by PG
    # version, so there is no reason to sweep the matrix here.
    services:
      postgres:
        image: "postgres:17"
        env:
          POSTGRES_DB: storm_db
          POSTGRES_USER: storm_db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U storm_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: No src/tests/cmake changes — heavy steps skipped
        if: env.RUN_HEAVY == 'false'
        run: echo "Diff touches none of src/, tests/ or cmake — build/test steps skipped."

      - name: Checkout
        if: env.RUN_HEAVY != 'false'
        uses: actions/checkout@v4

      - name: Link clang-p2996 next to source dir
        if: env.RUN_HEAVY != 'false'
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Create libc++ modules symlink for import std;
        if: env.RUN_HEAVY != 'false'
        # Same rationale as in the `test` job above (issue #326).
        run: |
          clang_root="$(dirname "$GITHUB_WORKSPACE")/clang-p2996"
          share_dir="$clang_root/build/share/libc++"
          link="$share_dir/v1"
          target="$clang_root/build/modules/c++/v1"
          if [ -d "$target" ] && [ ! -e "$link" ]; then
            mkdir -p "$share_dir"
            ln -sfn "$target" "$link"
            echo "Created symlink: $link -> $target"
          else
            echo "Symlink already exists or target missing — skipping"
          fi

      - name: Cache CPM packages
        if: env.RUN_HEAVY != 'false'
        uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-ninja-debug-${{ hashFiles('cmake/cpm.cmake', 'cmake/cmake-scripts.cmake', 'cmake/uuid.cmake', 'cmake/tests.cmake', 'cmake/bench.cmake') }}
          restore-keys: |
            cpm-ninja-debug-
            cpm-

      - name: Configure
        if: env.RUN_HEAVY != 'false'
        run: cmake --preset ninja-debug

      - name: Build
        if: env.RUN_HEAVY != 'false'
        # Build the test binaries through the retry wrapper first, so a
        # clang-scan-deps segfault (the known C++26 module flake) is retried here
        # rather than failing the coverage step and reading as a coverage drop.
        run: ./scripts/build-with-retry.sh ninja-debug

      - name: Run coverage and enforce 100% line threshold
        if: env.RUN_HEAVY != 'false'
        env:
          # Points coverage-run-batched.sh at the service container above,
          # overriding its local-socket default. Same value the `test` job uses.
          # Without this the PG-only lines are uncovered and the gate fails.
          STORM_PG_CONNSTR: "host=postgres port=5432 dbname=storm_db user=storm_db"
        run: |
          set -o pipefail
          # Drop stale profraw/profdata — same as commit.sh, prevents a partial
          # merge from reporting phantom uncovered lines.
          cmake --build --preset ninja-debug-coverage --target coverage-clean \
            > /dev/null 2>&1 || true

          # Summary lands under build/ (already gitignored) rather than the
          # workspace root, so the job leaves no stray file in the tree.
          summary=build/debug/coverage-summary.txt
          mkdir -p "$(dirname "$summary")"
          if ! cmake --build --preset ninja-debug-coverage --target coverage \
                 2>&1 | tee "$summary"; then
            echo "::error::Coverage build/analysis failed."
            exit 1
          fi

          # Parse the LINE row specifically. lcov --summary prints
          # "lines.......: 100.0% (8613 of 8613 lines)" alongside functions/branches
          # rows; anchoring on the wrong one would gate against ~81% or ~92% and
          # look like a broken job. Same helper commit.sh's run_coverage_check() uses.
          source scripts/lib/line_coverage.sh
          line_cov=$(storm_parse_line_coverage < "$summary")

          # An unparseable summary must fail loudly, not silently pass — a missing
          # number here would otherwise be indistinguishable from a clean run.
          if [ -z "$line_cov" ]; then
            echo "::error::Could not parse line coverage from the lcov summary."
            tail -20 "$summary"
            exit 1
          fi

          echo "Line coverage: ${line_cov}% (filtered set)"
          if [ "$line_cov" != "100.0" ]; then
            echo "::error::Line coverage ${line_cov}% is below the required 100.0%."
            echo "Uncovered lines (file:line):"
            # Write to a file first, then truncate for display. Piping awk
            # straight into `head -100` would SIGPIPE awk once the limit is hit;
            # under `set -e -o pipefail` that aborts this block at exit 141,
            # losing both the remaining output and the `exit 1` below — i.e. the
            # diagnostics vanish exactly when the drop is biggest.
            #
            # substr($0, 4) rather than `-F:` + $2: an lcov SF: path may itself
            # contain a colon, which field-splitting would silently truncate.
            # `/^DA:/` is anchored, so branch records (BRDA:...) don't match.
            uncovered=build/debug/coverage/uncovered.txt
            awk '
              /^SF:/  { file = substr($0, 4); next }
              /^DA:/  { split(substr($0, 4), d, ","); if (d[2] == 0) print "  " file ":" d[1] }
            ' build/debug/coverage/coverage-filtered.lcov > "$uncovered"
            head -100 "$uncovered"
            total=$(wc -l < "$uncovered")
            if [ "$total" -gt 100 ]; then
              echo "  ... and $((total - 100)) more (see the coverage-html artifact)"
            fi
            exit 1
          fi
          echo "OK: 100.0% line coverage on the filtered set."

      - name: Generate HTML report
        # Runs even on a failed gate — the report is most useful precisely when
        # coverage dropped.
        #
        # Calls genhtml directly rather than the `coverage-html` target: that
        # target DEPENDS on `coverage`, and these are always-out-of-date custom
        # targets, so building it would re-run the entire instrumented test suite
        # a second time. The tracefile it consumes was already produced by the
        # step above, so this just renders it.
        if: always() && env.RUN_HEAVY != 'false'
        run: |
          lcov_file=build/debug/coverage/coverage-filtered.lcov
          if [ ! -f "$lcov_file" ]; then
            echo "No tracefile at $lcov_file — coverage run did not get far enough."
            exit 0
          fi
          genhtml --rc branch_coverage=1 \
            --rc c_file_extensions=c,h,i,C,H,I,icc,cpp,cc,cxx,hh,hpp,hxx,cppm \
            --ignore-errors deprecated,range,inconsistent \
            --legend --title "Storm ORM Coverage (filtered)" \
            --output-directory build/debug/coverage/html-filtered \
            "$lcov_file"

      - name: Upload HTML coverage report
        if: always() && env.RUN_HEAVY != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/debug/coverage/html-filtered/
          retention-days: 14
          if-no-files-found: warn

  # Configure-only, with NO CPM cache (#702). Every other job restores
  # `.cache/CPM` with a `cpm-` restore-key fallback, so none of them ever fetches
  # a pinned dependency from the network — which is how #697 (upstream deleted
  # the cmake-scripts tag) stayed green in CI while every fresh clone failed to
  # configure. This job has no `actions/cache` step on purpose: every
  # `cpmaddpackage` pin is cloned for real, and a dead ref fails `cmake --preset`.
  #
  # Two presets cover all five pins: `ninja-release` fetches stduuid,
  # cmake-scripts, googletest and benchmark (a superset of `ninja-debug`), and
  # `ninja-python` adds nanobind. Configure only — nothing is built, so this
  # costs the container pull plus a few clones.
  #
  # Runs on the nightly `schedule` (an upstream deletion between PRs) and on PRs
  # that touch CMakeLists.txt / *.cmake or the CI plumbing (`run_cold_cpm`, set
  # by the `changes` job). Not on every PR: an upstream deletion or a GitHub
  # network blip would then red unrelated PRs. Step-gated, not job-gated, for
  # the same #638 reason as the heavy jobs above.
  cold-cpm-configure:
    name: cold CPM configure (#702)
    needs: changes
    # Always RUNS on a PR (fail-closed on a broken `changes` job, whose empty
    # output reads as "not false"); the steps below are what `run_cold_cpm`
    # gates. The `push` skip is job-level, as on the heavy jobs (#700).
    if: ${{ !cancelled() && github.event_name != 'push' }}
    env:
      RUN_COLD_CPM: ${{ needs.changes.outputs.run_cold_cpm }}
    runs-on: ubuntu-24.04
    # A network clone that hangs must not hold the gate for the 6-hour default.
    timeout-minutes: 20
    container:
      # Keep in sync with the `test` job's pin — scripts/check_ci_digests.py asserts they agree.
      image: ghcr.io/spiritecosse/storm-ci@sha256:ae4f62771d7611c663ccb8e0061af9acc8a8a3fe604eabde4285d11a77d37a61
    steps:
      - name: No CMake changes — cold configure skipped
        if: env.RUN_COLD_CPM == 'false'
        run: echo "Diff touches no CMakeLists.txt / *.cmake / CI plumbing — cold CPM configure skipped."

      - name: Checkout
        if: env.RUN_COLD_CPM != 'false'
        uses: actions/checkout@v4

      - name: Link clang-p2996 next to source dir
        if: env.RUN_COLD_CPM != 'false'
        run: ln -sfn /opt/clang-p2996 "$(dirname "$GITHUB_WORKSPACE")/clang-p2996"

      - name: Create libc++ modules symlink for import std;
        if: env.RUN_COLD_CPM != 'false'
        # Same rationale as in the `test` job above (issue #326).
        run: |
          clang_root="$(dirname "$GITHUB_WORKSPACE")/clang-p2996"
          share_dir="$clang_root/build/share/libc++"
          link="$share_dir/v1"
          target="$clang_root/build/modules/c++/v1"
          if [ -d "$target" ] && [ ! -e "$link" ]; then
            mkdir -p "$share_dir"
            ln -sfn "$target" "$link"
            echo "Created symlink: $link -> $target"
          else
            echo "Symlink already exists or target missing — skipping"
          fi

      # The whole point of the job, asserted rather than assumed: a cache step
      # added here later (copied from `test`) would silently turn it back into
      # a warm configure that cannot see a dead ref.
      - name: Assert the CPM cache is empty
        if: env.RUN_COLD_CPM != 'false'
        run: |
          if [ -n "$(ls -A .cache/CPM 2>/dev/null)" ]; then
            echo "::error::.cache/CPM is not empty — this job must fetch every CPM pin from the network."
            ls -la .cache/CPM
            exit 1
          fi

      - name: Configure ninja-release (stduuid, cmake-scripts, googletest, benchmark)
        if: env.RUN_COLD_CPM != 'false'
        run: cmake --preset ninja-release

      - name: Configure ninja-python (nanobind)
        if: env.RUN_COLD_CPM != 'false'
        run: cmake --preset ninja-python

  # Single required status check for develop's branch protection.
  #
  # Exists so the per-job contexts do not have to be named in the required
  # list at all. That matters because a job skipped by a job-level `if:`
  # cannot report the contexts a MATRIX expands into (#638 — see the note on
  # the `changes` job): requiring `ninja-debug / PG 17` and friends makes any
  # PR that skips the matrix unmergeable. Requiring THIS job instead makes the
  # skip invisible to branch protection, because this job always runs and
  # reports under one fixed name.
  #
  # THE CONTEXT STRING IS EXACTLY `CI gate` — the job name alone. The PR checks
  # list renders it as `CI / CI gate` (workflow name / job name); copying THAT
  # into branch protection yields a context nothing ever reports, whose symptom
  # is indistinguishable from #638. Bind it to the GitHub Actions app
  # (`checks[] = {"context": "CI gate", "app_id": 15368}`) rather than the bare
  # context form, so no other integration can satisfy a name this generic.
  #
  # MIGRATION — the order is not reversible in either direction:
  #
  #   1. Merge the PR that introduces this job. It touches .github/workflows/,
  #      so run_heavy=true and every per-matrix context still reports; it is
  #      mergeable under today's required list.
  #   2. Confirm `CI gate` has reported at least once on develop (the post-merge
  #      push run), so GitHub offers the context in the settings UI at all.
  #   3. Make `CI gate` the ONLY required context — in the merge-queue
  #      ruleset on develop (#711), with the classic branch protection deleted.
  #      That drops every per-job and per-matrix context (the seven matrix
  #      legs, `coverage (100% lines, filtered)`, `clang-p2996 host-layout
  #      resolution`, `pre-commit guards (all, #708)`, `detect changed files`)
  #      AND `SonarCloud Code Analysis`: the `sonar-gate` job enforces that
  #      gate inside `CI gate`, and the app's own check never reports on a
  #      merge-group commit. Removing is not optional: adding `CI gate`
  #      alongside the old names leaves docs-only PRs stuck on them.
  #      ORDER (#711) — the queue must never coexist with the classic rules:
  #        i.   merge #711 under the classic protection (it adds `merge_group:`;
  #             a queue enabled before that reports nothing on its commits);
  #        ii.  create the ruleset requiring `CI gate`, merge queue still OFF;
  #        iii. delete the classic protection — its required `SonarCloud Code
  #             Analysis` never reports on a merge-group commit, and its
  #             `strict` fights the queue, so a PR queued while it exists
  #             waits out the queue timeout;
  #        iv.  only then turn the merge queue on, and verify with a small
  #             docs-only PR (it also shows which conclusion Sonar posts on a
  #             PR with no C++ — sonar_gate.py fails anything but `success`).
  #   4. Only then, the flip below.
  #   5. Verify on a docs-only PR: heavy jobs `skipped`, `CI gate` green,
  #      merge unblocked.
  #
  # Step 3 must NOT precede step 1: `CI gate` does not exist on develop until
  # this job is merged, so requiring it first strands EVERY open PR — including
  # the one that would create it — on a context no run will ever report.
  # Step 4 must NOT precede step 3: that is #638, reproduced exactly.
  #
  # THE FLIP (step 4), which returns docs-only PRs to zero cost — no container
  # pull, no postgres service, nothing started at all:
  #
  #   a. Append `&& needs.changes.outputs.run_heavy != 'false'` to the
  #      job-level `if:` of `test`, `coverage` and `clang-p2996-host-layout`,
  #      keeping the `github.event_name != 'push'` term (#700).
  #      Fail-closed survives: a broken `changes` job leaves the output empty
  #      and '' != 'false' still runs everything.
  #   b. Delete the now-unreachable `No src/tests/cmake changes — heavy steps
  #      skipped` step at the top of those three jobs. After (a) its condition
  #      is the exact negation of the job-level one, so it is dead code that
  #      reads as if step-gating were still doing work.
  #   c. Update CLAUDE.md rule 7: its "the jobs still RUN and report green,
  #      with their build/test steps skipped" clause describes the pre-flip
  #      mechanism and becomes false.
  #
  # The step-level `env.RUN_HEAVY` guards themselves can stay — they are only
  # reachable when the job-level condition already let the job run.
  ci-gate:
    name: CI gate
    # always(), not !cancelled(): a cancelled dependency must read as a
    # failure here, never as a pass, and never leave this context unreported.
    if: always()
    needs:
      - changes
      - script-guards
      - sonar-gate
      - clang-p2996-host-layout
      - test
      - coverage
      - cold-cpm-configure
    # Bare runner on purpose: no container, no services, so this costs seconds
    # even when everything it gates was skipped. `jq` below comes from the
    # HOSTED ubuntu-24.04 image — that guarantee does not survive adding a
    # `container:` here, so do not add one.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The assertion below is negative — "no dependency has a bad result" —
      # which on its own would pass vacuously if `needs:` were emptied, and
      # would silently ignore a job added to `jobs:` but never wired into
      # `needs:`. Once this is the ONLY required CI context, such a job could
      # go red on a PR without blocking the merge: CI green while blind to
      # something it never looked at. So assert the two lists agree first,
      # the same way check_ci_digests.py asserts the image pins agree rather than
      # trusting that they do.
      - name: Assert this job gates every job in the workflow
        run: |
          set -euo pipefail
          declared=$(awk '
            /^jobs:/            { in_jobs = 1; next }
            in_jobs && /^[^ #]/ { in_jobs = 0 }
            in_jobs && /^  [A-Za-z0-9_.-]+:[[:space:]]*$/ {
              sub(/:[[:space:]]*$/, ""); sub(/^  /, ""); print
            }
          ' .github/workflows/ci.yml | grep -vx 'ci-gate' | sort)
          gated=$(echo '${{ toJSON(needs) }}' | jq -r 'keys[]' | sort)
          if [ "$declared" != "$gated" ]; then
            echo "::error::ci-gate's needs: list has drifted from the workflow's jobs."
            echo "Jobs declared in ci.yml (excluding ci-gate):"
            echo "$declared" | sed 's/^/  /'
            echo "Jobs actually gated by ci-gate:"
            echo "$gated" | sed 's/^/  /'
            echo "Add the missing job(s) to ci-gate's needs: list."
            exit 1
          fi
          echo "CI gate covers all $(echo "$declared" | wc -l) jobs."

      - name: Assert every job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # `skipped` is a pass: that is the whole point of this job. Any other
          # result — failure, cancelled, or one this expression does not
          # recognise — fails. Coverage of the needs: list itself is the
          # previous step's job, not this one's.
          bad=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key) (\(.value.result))"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failed — these jobs did not pass:"
            echo "$bad" | sed 's/^/  /'
            # Keys are job IDs, so a failing matrix leg reads as `test`. The
            # legs report individually; this job cannot name which one.
            echo "::error::See this run's job list for the specific failure — matrix legs report individually."
            exit 1
          fi
          echo "CI gate passed."
