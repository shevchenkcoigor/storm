- name: distinct_dept_all
  model: person
  query_type: distinct
  dataset: main
  distinct:
    fields:
    - department
  expected:
    count: 5
- name: distinct_dept_order_limit2
  model: person
  query_type: distinct
  dataset: main
  order_by:
  - field: department
    direction: ASC
  distinct:
    fields:
    - department
  limit:
    value: 2
    offset: 0
  expected:
    count: 2
- name: distinct_dept_order_limit2_offset1
  model: person
