- name: distinct_dept_age_multi_order_limit5
  model: person
  query_type: distinct
  dataset: main
  order_by:
  - field: department
    direction: ASC
  distinct:
    fields:
    - department
    - age
  limit:
    value: 5
    offset: 0
  expected:
    count: 5
# (department, age) alone has 24 groups -- Ivy and Quinn are both Engineering/30 --
# so 25 only if the THIRD field is honored (#835: a third entry used to be ignored).
- name: distinct_dept_age_name_three_fields
  model: person
  query_type: distinct
  dataset: main
  distinct:
    fields:
    - department
    - age
    - name
  expected:
    count: 25
- name: distinct_name_where_age_gt25_order_by_name
  model: person
  query_type: distinct
  dataset: main
  where:
    conditions:
    - field: age
      op: '>'
      values:
      - 25
  order_by:
  - field: name
    direction: ASC
  distinct:
    fields:
    - name
  expected:
    count: 20
- name: distinct_age_standard5
  model: person
  query_type: distinct
  dataset: main
  distinct:
    fields:
    - age
  expected:
    count: 14
- name: distinct_age_name_where_salary_gte60k
  model: person
  query_type: distinct
  dataset: main
  where:
    conditions:
    - field: salary
      op: '>='
      values:
      - 60000.0
  order_by:
  - field: age
    direction: ASC
  distinct:
    fields:
    - age
    - name
  expected:
    count: 16
