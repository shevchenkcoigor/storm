# ---------------------------------------------------------------------------------------------
# JOIN over relations (#869, Phase 5 of #838): several FKs in one join, m2m (auto junction and
# many_to_many_through), reverse_fk, several relations in one join<> call, and the cross-model FK
# selector in aggregates. Every case here uses dataset `relations` (the models of
# tests/test_relation_models.h, YAML names in tests/test_yaml_models.h), which puts it in the `join`
# slice whatever its query_type. The rows, in insertion order:
#   student (BStudent, auto m2m `courses`)   Alice 20 -> [Math, Physics]   Bob 22 -> [Math]   Carol 25 -> []
#   member  (BMember, auto m2m `courses` and `clubs`)
#           Ann -> courses [Math, Physics], clubs [Chess]   Ben -> [Math], []
#           Cat -> [], [Chess, Robotics]                    Dan -> [], []
#   pupil   (BPupil, `courses` through BEnrollment)   Pia -> [Math A, Physics B]   Quinn -> [Chemistry A]   Rex -> []
#   author  (BAuthor, reverse_fk `posts` of BPost.author)   Austen -> [P1, P2]   Bronte -> [P3]   Carver -> []
#   bug     (BBug, two FKs to BReporter)   b1 Rita/Sam   b2 Rita/Sam   b3 Sam/Rita   b4 Rita/Tom   (author/reviewer)
#   reporter (BReporter)   Rita   Sam   Tom
# `join.fk` names a member of the case's model; `fks: [a, b]` several of one kind (FKs, or m2m / reverse_fk
# relations) in ONE join<> call; `<model>.<member>` (bug.author) is a cross-model FK selector, valid on
# aggregate / filter chains. In `expected.first` an m2m / reverse_fk member is checked by its SIZE.
# ---------------------------------------------------------------------------------------------

# --- m2m, auto junction -------------------------------------------------------------------------
- name: join_m2m_auto_inner
  model: student
  query_type: select
  dataset: relations
  join:
    type: inner
    fk: courses
  order_by:
  - field: name
    direction: ASC
  expected:
    count: 2
    first:
      name: Alice
      courses: 2
- name: join_m2m_auto_left
  model: student
  query_type: select
  dataset: relations
  join:
    type: left
    fk: courses
  order_by:
  - field: name
    direction: DESC
  expected:
    count: 3
    first:
      name: Carol
      courses: 0
- name: join_m2m_auto_inner_where
  model: student
  query_type: select
  dataset: relations
  where:
    conditions:
    - field: age
      op: '>'
      values:
      - 20
  join:
    type: inner
    fk: courses
  expected:
    count: 1
    first:
      name: Bob
      courses: 1
- name: join_m2m_auto_left_limit_offset
  model: student
  query_type: select
  dataset: relations
  join:
    type: left
    fk: courses
  order_by:
  - field: name
    direction: ASC
  limit:
    value: 1
    offset: 1
  expected:
    count: 1
    first:
      name: Bob
      courses: 1
- name: join_m2m_auto_rows
  model: student
  query_type: rows
  dataset: relations
  join:
    type: left
    fk: courses
  order_by:
  - field: name
    direction: ASC
  expected:
    count: 3
    first:
      name: Alice
      courses: 2

# --- m2m through an explicit junction model -----------------------------------------------------
- name: join_m2m_through_inner
  model: pupil
  query_type: select
  dataset: relations
  join:
    type: inner
    fk: courses
  order_by:
  - field: name
    direction: ASC
  expected:
    count: 2
    first:
      name: Pia
      courses: 2
- name: join_m2m_through_left
  model: pupil
  query_type: select
  dataset: relations
  join:
    type: left
    fk: courses
  order_by:
  - field: name
    direction: DESC
  expected:
    count: 3
    first:
      name: Rex
      courses: 0
- name: join_m2m_through_first_where
  model: pupil
  query_type: first
  dataset: relations
  where:
    conditions:
    - field: name
      op: ==
      values:
      - Quinn
  join:
    type: inner
    fk: courses
  expected:
    count: 1
    first:
      name: Quinn
      courses: 1

# --- reverse_fk -------------------------------------------------------------------------------
