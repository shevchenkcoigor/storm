# --- several relations in one join<> call ------------------------------------------------------
- name: join_multi_m2m_inner
  model: member
  query_type: select
  dataset: relations
  join:
    type: inner
    fks:
    - courses
    - clubs
  expected:
    count: 1
    first:
      name: Ann
      courses: 2
      clubs: 1
- name: join_multi_m2m_left_where
  model: member
  query_type: select
  dataset: relations
  where:
    conditions:
    - field: name
      op: ==
      values:
      - Cat
  join:
    type: left
    fks:
    - courses
    - clubs
  expected:
    count: 1
    first:
      name: Cat
      courses: 0
      clubs: 2
- name: join_multi_m2m_left_rows
  model: member
  query_type: rows
  dataset: relations
  join:
    type: left
    fks:
    - courses
    - clubs
  order_by:
  - field: name
    direction: DESC
  expected:
    count: 4
    first:
      name: Dan
      courses: 0
      clubs: 0

# --- several FKs in one join<> call -------------------------------------------------------------
- name: join_multi_fk_inner
  model: bug
  query_type: select
  dataset: relations
  join:
    type: inner
    fks:
    - author
    - reviewer
  order_by:
  - field: summary
    direction: DESC
  expected:
    count: 4
    first:
      summary: b4
- name: join_multi_fk_left_where
  model: bug
  query_type: select
  dataset: relations
  where:
    conditions:
    - field: summary
      op: IN
      values:
      - b1
      - b3
  join:
    type: left
    fks:
    - author
    - reviewer
  expected:
    count: 2

# --- aggregates over relations ------------------------------------------------------------------
# An aggregate over an m2m / reverse_fk join counts (base, related) pairs, and several relations their
# cartesian tuples; a LEFT join adds one row for a base entity with no related row.
- name: count_join_m2m_auto_inner
  model: student
  query_type: count
  dataset: relations
  join:
    type: inner
    fk: courses
  expected:
    int_val: 3
- name: count_join_m2m_auto_left
  model: student
  query_type: count
  dataset: relations
  join:
    type: left
    fk: courses
  expected:
    int_val: 4
- name: sum_join_m2m_auto_age
  model: student
  query_type: sum
  dataset: relations
  aggregate:
    func: sum
    field: age
  join:
    type: inner
    fk: courses
  expected:
    int_val: 62
- name: count_join_m2m_through_inner
  model: pupil
  query_type: count
  dataset: relations
  join:
    type: inner
    fk: courses
  expected:
    int_val: 3
- name: count_join_reverse_fk_left
  model: author
  query_type: count
  dataset: relations
  join:
    type: left
    fk: posts
  expected:
    int_val: 4
- name: count_join_multi_m2m_left
  model: member
  query_type: count
  dataset: relations
  join:
    type: left
    fks:
    - courses
    - clubs
  expected:
    int_val: 6

# --- cross-model FK selector: which of BBug's two FKs back at BReporter to join on -----------------
# LEFT: Rita authored 3 bugs, Sam 1, Tom none (one NULL row) -> 5; Rita reviewed 1, Sam 2, Tom 1 -> 4.
- name: count_join_cross_model_fk_author_left
  model: reporter
  query_type: count
  dataset: relations
  join:
    type: left
    fk: bug.author
  expected_sql: 'SELECT COUNT(*) FROM "breporter" t1 LEFT JOIN "bbug" t2 ON t2."author_id" = t1."id"'
  expected:
    int_val: 5
- name: count_join_cross_model_fk_reviewer_left
  model: reporter
  query_type: count
  dataset: relations
  join:
    type: left
    fk: bug.reviewer
  expected_sql: 'SELECT COUNT(*) FROM "breporter" t1 LEFT JOIN "bbug" t2 ON t2."reviewer_id" = t1."id"'
  expected:
    int_val: 4
- name: count_join_cross_model_fk_author_where
  model: reporter
  query_type: count
  dataset: relations
  where:
    conditions:
    - field: name
      op: ==
      values:
      - Rita
  join:
    type: inner
    fk: bug.author
  expected:
    int_val: 3
- name: count_join_cross_model_fk_reviewer_where
  model: reporter
  query_type: count
  dataset: relations
  where:
    conditions:
    - field: name
      op: ==
      values:
      - Rita
  join:
    type: inner
    fk: bug.reviewer
  expected:
    int_val: 1

# --- GROUP BY and DISTINCT over an m2m join ---------------------------------------------------------
- name: group_count_join_m2m_auto_by_age
  model: student
  query_type: group_count
  dataset: relations
  group_by:
    fields:
    - age
  join:
    type: inner
    fk: courses
  expected:
    count: 2
    groups_count: 2
    group_keys:
    - 20
    - 22
    group_agg_int:
    - 2
    - 1
- name: distinct_join_m2m_auto_name
  model: student
  query_type: distinct
  dataset: relations
  distinct:
    fields:
    - name
  join:
    type: inner
    fk: courses
  expected:
    count: 2

# --- the related model of the m2m relations, on its own (#872) ------------------------------------
- name: join_course_related_model_select
  model: course
  query_type: select
  dataset: relations
  order_by:
  - field: title
    direction: ASC
  expected:
    count: 3
    first:
      title: Chemistry
