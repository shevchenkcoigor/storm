- name: setop_sql_chain3_intersect_then_union
  model: simple
  query_type: setop
  dataset: empty
  setop:
    operands:
    - {}
    - op: intersect
      where:
        conditions:
        - field: value
          op: '>'
          values: [1]
    - op: union
      where:
        conditions:
        - field: name
          op: ==
          values: [x]
  # No parentheses: the chain is one compound SELECT, read left to right.
  expected_sql: 'SELECT "id", "name", "value" FROM "simplerecord" INTERSECT SELECT "id", "name", "value" FROM "simplerecord" WHERE "value" > ? UNION SELECT "id", "name", "value" FROM "simplerecord" WHERE "name" = ?'
  expected:
    count: 0
