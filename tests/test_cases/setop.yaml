- name: setop_intersect_double_and_between
  model: person
  query_type: setop
  dataset: main
  setop:
    operands:
    - where:
        conditions:
        - field: salary
          op: '>='
          values:
          - 60000.0
    - op: intersect
      where:
        conditions:
        - field: age
          op: BETWEEN
          values:
          - 30
          - 35
  order_by:
  - field: name
    direction: ASC
  expected:
    count: 7
    first:
      name: Bob
      salary: 62000.0
- name: setop_intersect_and_tree
