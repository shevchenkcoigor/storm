# Set operations (#870): a chain of 2..4 operands, `setop.operands`. The first entry is the leading
# SELECT; each later entry has `op` (union | union_all | except | intersect) and joins the result so
# far. An entry's `where:` filters that SELECT; an entry without one is the whole table. order_by /
# limit apply to the combined result. An `intersect` after any other op is a compile error: SQLite
# reads a chain left to right, PostgreSQL binds INTERSECT tighter, so the same text differs per
# backend. The operands' WHERE trees share the case's WHERE caps (7 nodes, 10 values in all).
# Set-op row order is undefined, so a case that checks `expected.first` on more than one row
# orders the result. Dataset `main` is PEOPLE_25 (shared/models/people_25.h).
- name: setop_union_disjoint
  model: person
  query_type: setop
  dataset: main
  setop:
    operands:
    - where:
        conditions:
        - field: age
          op: <
          values:
          - 24
    - op: union
      where:
        conditions:
        - field: age
          op: '>'
          values:
          - 40
  order_by:
  - field: age
    direction: ASC
  - field: name
    direction: ASC
  expected:
    count: 6
    first:
      name: Paul
      age: 22
- name: setop_union_overlap_deduplicates
  model: person
  query_type: setop
  dataset: main
  setop:
    operands:
    - where:
        conditions:
        - field: age
          op: '>='
          values:
          - 40
    - op: union
      where:
        conditions:
        - field: age
          op: <=
          values:
          - 45
  expected:
    count: 25
- name: setop_union_all_keeps_duplicates
