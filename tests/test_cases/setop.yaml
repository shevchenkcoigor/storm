- name: setop_sql_union_all
  model: simple
  query_type: setop
  dataset: empty
  setop:
    operands:
    - where:
        conditions:
        - field: value
          op: <
          values:
          - 10
    - op: union_all
      where:
        conditions:
        - field: value
          op: '>'
          values:
          - 20
  expected_sql: SELECT "id", "name", "value" FROM "simplerecord" WHERE "value" < ? UNION ALL SELECT "id", "name", "value" FROM "simplerecord" WHERE "value" > ?
  expected:
    count: 0
- name: setop_sql_except_order_limit
  model: simple
  query_type: setop
  dataset: empty
  setop:
    operands:
    - {}
    - op: except
      where:
        conditions:
        - field: value
          op: ==
          values:
          - 5
  order_by:
  - field: name
    direction: ASC
  limit:
    value: 2
  expected_sql_sqlite: SELECT "id", "name", "value" FROM "simplerecord" EXCEPT SELECT "id", "name", "value" FROM "simplerecord" WHERE "value" = ? ORDER BY "name" ASC LIMIT 2
  expected_sql_pg: SELECT "id", "name", "value" FROM "simplerecord" EXCEPT SELECT "id", "name", "value" FROM "simplerecord" WHERE "value" = ? ORDER BY "name" ASC NULLS FIRST LIMIT 2
  expected:
    count: 0
- name: setop_sql_intersect
  model: simple
  query_type: setop
  dataset: empty
  setop:
    operands:
    - where:
        conditions:
        - field: name
          op: '!='
          values:
          - x
    - op: intersect
      where:
        conditions:
        - field: value
          op: '>='
          values:
          - 1
  expected_sql: SELECT "id", "name", "value" FROM "simplerecord" WHERE "name" != ? INTERSECT SELECT "id", "name", "value" FROM "simplerecord" WHERE "value" >= ?
  expected:
    count: 0
