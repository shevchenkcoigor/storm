  order_by:
  - field: label
    direction: ASC
  expected:
    count: 1
    first:
      label: beta
      color: Green
- name: typed_enum_where_in
  model: extended
  query_type: select
  dataset: extended
  where:
    conditions:
    - field: color
      op: IN
      values:
      - Red
      - Blue
  order_by:
  - field: label
    direction: ASC
  expected:
    count: 2
    first:
      label: alpha
      color: Red
- name: typed_optional_enum_where_eq
  model: extended
  query_type: select
  dataset: extended
  where:
    conditions:
    - field: opt_color
      op: ==
      values:
      - Blue
  order_by:
  - field: label
    direction: ASC
  expected:
    count: 1
    first:
      label: beta
      opt_color: Blue
- name: typed_blob_first_row_alpha
  model: extended
  query_type: select
  dataset: extended
  where:
    conditions:
    - field: label
      op: ==
      values:
      - alpha
  order_by:
  - field: label
    direction: ASC
  expected:
    count: 1
    first:
      label: alpha
      raw_data: 'DEADBEEF'
- name: dialect_sql_order_by_asc_nulls_first
  model: simple
  query_type: select
  dataset: empty
  order_by:
  - field: name
    direction: ASC
  expected_sql_sqlite: 'SELECT "id", "name", "value" FROM "simplerecord" ORDER BY "name" ASC'
  expected_sql_pg: 'SELECT "id", "name", "value" FROM "simplerecord" ORDER BY "name" ASC NULLS FIRST'
  expected:
    count: 0
- name: dialect_sql_order_by_desc_nulls_last
  model: simple
  query_type: select
  dataset: empty
  order_by:
  - field: name
    direction: DESC
  expected_sql_sqlite: 'SELECT "id", "name", "value" FROM "simplerecord" ORDER BY "name" DESC'
  expected_sql_pg: 'SELECT "id", "name", "value" FROM "simplerecord" ORDER BY "name" DESC NULLS LAST'
  expected:
    count: 0
- name: dialect_sql_offset_only_limit_all
  model: simple
  query_type: select
  dataset: empty
  limit:
    value: 0
    offset: 2
  expected_sql_sqlite: 'SELECT "id", "name", "value" FROM "simplerecord" LIMIT -1 OFFSET 2'
  expected_sql_pg: 'SELECT "id", "name", "value" FROM "simplerecord" LIMIT ALL OFFSET 2'
  expected:
    count: 0
