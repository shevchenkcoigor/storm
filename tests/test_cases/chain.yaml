- name: full_chain_select_dept8
  model: person
  query_type: select
  dataset: main
  where:
    conditions:
    - field: age
      op: '>'
      values:
      - 25
  order_by:
  - field: age
    direction: ASC
  limit:
    value: 2
    offset: 1
  expected:
    count: 2
- name: full_chain_count_dept8
  model: person
  dataset: main
  where:
    conditions:
    - field: age
      op: '>='
      values:
      - 30
  aggregate:
    func: count
    field: ''
  expected_sql: 'SELECT COUNT(*) FROM "person" WHERE "age" >= ?'
