# A chain step over several fields (#868): SUM(age + years_experience) is 1064 on `main`.
- name: chain_sum_two_fields_count
  model: person
  dataset: main
  aggregations:
  - func: sum
    fields: [age, years_experience]
    result:
      value: 1064
  - func: count
    result:
      value: 25
  expected: {}
  query_type: chain
# GROUP BY + aggregate chain (#868): one row per group, tuple<key, a1, ..., aN>. Each step's
# `result.groups` lists its per-group value in ascending key order, beside expected.group_keys.
# Dataset `main` by years_experience: 5 -> 10 rows (age sum 268, salary avg 50300),
# 10 -> 8 rows (285, 76375), 15 -> 7 rows (276, 84000).
- name: group_chain_count_sum_avg_by_years_experience
  model: person
  query_type: chain
  dataset: main
  group_by:
    fields: [years_experience]
  aggregations:
  - func: count
    result:
      groups: [10, 8, 7]
  - func: sum
    field: age
    result:
      groups: [268, 285, 276]
  - func: avg
    field: salary
    result:
      groups: [50300.0, 76375.0, 84000.0]
  expected:
    count: 3
    groups_count: 3
    group_keys: [5, 10, 15]
# WHERE age > 25 drops 5 of the years_experience=5 rows; ORDER BY DESC + LIMIT 2 keeps the groups
# 15 and 10 (checked in ascending key order). A step over two fields: SUM(age + years_experience).
- name: group_chain_where_order_limit_by_years_experience
  model: person
  query_type: chain
  dataset: main
  where:
    conditions:
    - field: age
      op: '>'
      values: [25]
  group_by:
    fields: [years_experience]
  order_by:
  - field: years_experience
    direction: DESC
  limit:
    value: 2
  aggregations:
  - func: count
    result:
      groups: [8, 7]
  - func: sum
    fields: [age, years_experience]
    result:
      groups: [365, 381]
  - func: min
    field: age
    result:
      groups: [29.0, 35.0]
  expected:
    count: 2
    groups_count: 2
    group_keys: [10, 15]
# HAVING + chain: HAVING years_experience >= 10 keeps the groups 10 and 15.
- name: group_chain_having_count_max_by_years_experience
  model: person
  query_type: chain
  dataset: main
  group_by:
    fields: [years_experience]
    having:
      conditions:
      - field: years_experience
        op: '>='
        values: [10]
  aggregations:
  - func: count
    result:
      groups: [8, 7]
  - func: max
    field: salary
    result:
      groups: [98000.0, 93000.0]
  expected:
    count: 2
    groups_count: 2
    group_keys: [10, 15]
