# Upsert: Person's `name` is unique, and (name, department) is a UniqueIndex.
- name: upsert_update_on_conflict_name
  model: person
  query_type: upsert_update
  dataset: main
  set: {name: Alice, age: 99}
  on_conflict: {target: [name], update: [age]}
  expected: {remaining: 25, matching: 1}
- name: upsert_update_inserts_a_new_row
  model: person
  query_type: upsert_update
  dataset: main
  set: {name: Zed, age: 99, department: Ops}
  on_conflict: {target: [name], update: [age]}
  expected: {remaining: 26, matching: 1}
- name: upsert_update_two_columns
  model: person
  query_type: upsert_update
  dataset: main
  set: {name: Bob, age: 31, salary: 1.5}
  on_conflict: {target: [name], update: [age, salary]}
  expected: {remaining: 25, matching: 1}
# Only the `update` columns change on a conflict: Charlie keeps department Marketing, so no row
# equals all three `set:` fields afterwards.
- name: upsert_update_leaves_unlisted_columns
  model: person
  query_type: upsert_update
  dataset: main
  set: {name: Charlie, age: 77, department: Ops}
  on_conflict: {target: [name], update: [age]}
  expected: {remaining: 25, matching: 0}
- name: upsert_update_unique_index_target
  model: person
  query_type: upsert_update
  dataset: main
  set: {name: Diana, department: HR, age: 60}
  on_conflict: {target: [name, department], update: [age]}
  expected: {remaining: 25, matching: 1}
- name: upsert_nothing_on_conflict_name
  model: person
  query_type: upsert_nothing
  dataset: main
  set: {name: Alice, age: 99}
  on_conflict: {target: [name]}
  expected: {remaining: 25, matching: 0}
- name: upsert_nothing_inserts_a_new_row
  model: person
  query_type: upsert_nothing
  dataset: main
  set: {name: Zed, age: 99}
  on_conflict: {target: [name]}
