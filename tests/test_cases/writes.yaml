# ---------------------------------------------------------------------------------------------
# Conditional writes and upsert (#871). Each case checks the write's EFFECT, not that it ran:
#   expected.remaining  rows in the table after the write
#   expected.matching   rows equal to `set:` on every field it lists, after the write
# `set:` is the SET columns and their values (update_where / update_all) or the inserted row
# (upsert_*; unlisted members keep their defaults). The runner first checks that NO row equals
# `set:` before the write, so `matching` counts exactly the rows the write produced: pick values
# no seeded row holds. erase_where also checks that no row matches its `where` afterwards.
# Dataset `main` (PEOPLE_25): departments Engineering 6, Sales 5, Marketing 5, HR 4, Support 5;
# 9 inactive; 10 with a NULL score; salaries below 50000: Diana, Mia, Paul, Tina, Yara.
# ---------------------------------------------------------------------------------------------
- name: update_where_salary_below_50k
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: salary, op: '<', values: [50000.0]}]}
  set: {salary: 50500.5}
  expected: {remaining: 25, matching: 5}
- name: update_where_two_columns_hr
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: department, op: ==, values: [HR]}]}
  set: {salary: 12345.0, is_active: false}
  expected: {remaining: 25, matching: 4}
- name: update_where_or_tree_age_extremes
  model: person
  query_type: update_where
  dataset: main
  where_expr:
    op: OR
    left: {field: age, op: '<', value_int: 23}
    right: {field: age, op: '>', value_int: 45}
  set: {years_experience: 99}
  expected: {remaining: 25, matching: 3}
- name: update_where_in_ages
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: age, op: IN, values: [25, 30]}]}
  set: {department: Platform}
  expected: {remaining: 25, matching: 6}
- name: update_where_like_sets_text
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: name, op: LIKE, values: ['A%']}]}
  set: {nickname: Ace}
  expected: {remaining: 25, matching: 1}
- name: update_where_sets_null
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: department, op: ==, values: [Engineering]}]}
  set: {score: null, years_experience: 77}
  expected: {remaining: 25, matching: 6}
- name: update_where_bool_filter
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: is_active, op: ==, values: [false]}]}
  set: {score: 1}
  expected: {remaining: 25, matching: 9}
- name: update_where_no_match
  model: person
  query_type: update_where
  dataset: main
  where: {conditions: [{field: age, op: '>', values: [100]}]}
  set: {age: 77}
  expected: {remaining: 25, matching: 0}
- name: update_where_simple_custom
  model: simple
  query_type: update_where
  dataset: custom
  init_dataset_size: 20
  where: {conditions: [{field: value, op: '>=', values: [15]}]}
